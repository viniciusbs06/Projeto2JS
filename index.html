<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cálculo de Notas</title>
 <script src="script.js" defer></script>
 <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Calcular Notas</h1>

  <div class="tabela">
    <input type="text" id="nome" placeholder="Nome do aluno: ">
    <input type="number" id="nota1" placeholder="Nota 1: ">
    <input type="number" id="nota2" placeholder="Nota 2: ">
    <button onclick="calcularNota()">Calcular</button>
  </div>

  <h2>Lista de Alunos</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Nota 1: </th>
        <th>Nota 2: </th>
        <th>Média: </th>
        <th>Status: </th>
      </tr>
    </thead>
    <tbody id="arrayAlunos"></tbody>
  </table>

  <h2>Alunos com nota 10: </h2>
  <ul id="alunosNota10"></ul>


</body>
</html>
